<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#312e81" />
  <title>私人云盘</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登录界面 -->
  <div id="login" class="login-screen">
    <div class="login-bg"></div>
    <form id="login-form" class="login-card">
      <div class="login-logo">☁️</div>
      <h1>私人云盘</h1>
      <p class="login-sub">请输入访问密码</p>
      <input id="password" type="password" placeholder="密码" autocomplete="current-password" />
      <button type="submit">登 录</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>

  <!-- 主界面 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">☁️</span>
        <span class="brand-text">私人云盘</span>
      </div>
      <div class="topbar-right">
        <span id="quota-badge" class="quota-badge" title="云盘容量使用情况">💾 …</span>
        <button id="btn-pickdir" class="btn ghost" title="选择下载保存到哪个文件夹（桌面浏览器）">📥 下载目录</button>
        <button id="btn-settings" class="btn ghost" title="设置">⚙️ 设置</button>
        <button id="btn-logout" class="btn ghost">退出</button>
      </div>
    </header>

    <div class="toolbar">
      <nav id="breadcrumb" class="breadcrumb"></nav>
      <div class="toolbar-actions">
        <div class="search-wrap">
          <input id="search-input" class="search-input" type="search"
                 placeholder="🔍 搜索文件名…" autocomplete="off" />
          <button id="search-clear" class="search-clear hidden" title="清除搜索">✕</button>
        </div>
        <select id="sort-select" class="sort-select" title="排序方式">
          <option value="name">按名称</option>
          <option value="time">按时间</option>
          <option value="type">按类型</option>
        </select>
        <button id="sort-dir" class="btn ghost sort-dir" title="切换升序/降序">↑</button>
        <button id="btn-mkdir" class="btn">📁 新建</button>
        <button id="btn-upload" class="btn primary">⬆️ 上传</button>
        <button id="btn-dldown" class="btn" disabled>⬇️ 下载选中</button>
        <button id="btn-del" class="btn danger" disabled>🗑 删除选中</button>
        <input id="file-input" type="file" multiple hidden />
      </div>
    </div>

    <main id="filelist" class="filelist">
      <div class="empty"><div class="empty-ico">⏳</div><div class="empty-t">加载中…</div></div>
    </main>

    <footer class="footer">
      <span>© 2026 私人云盘 · 版权所有</span>
      <span class="ft-sep">·</span>
      <span class="ft-dim">Built with Flask</span>
    </footer>

    <!-- 上传队列（上传时自动弹出） -->
    <div id="upload-panel" class="up-panel hidden">
      <div class="up-head">
        <span class="up-title">⬆️ 上传队列</span>
        <button id="up-close" class="up-x" title="收起">✕</button>
      </div>
      <div id="up-list" class="up-list"></div>
    </div>

    <!-- 拖拽上传遮罩 -->
    <div id="drop-overlay" class="drop-overlay">
      <div class="drop-inner">📂 松手即可上传到当前目录</div>
    </div>

    <!-- 预览模态框（居中卡片式，点遮罩/Esc/✕ 均可关闭） -->
    <div id="preview-modal" class="pv-modal hidden">
      <div class="pv-card" role="dialog" aria-modal="true">
        <div class="pv-bar">
          <span id="pv-ico" class="pv-ico">📄</span>
          <div class="pv-head">
            <span id="pv-title" class="pv-title"></span>
            <span id="pv-size" class="pv-size"></span>
          </div>
          <div class="pv-actions">
            <button id="pv-share" class="btn ghost small" title="生成免登录下载链接">🔗 分享</button>
            <button id="pv-download" class="btn ghost small" title="下载该文件">⬇️ 下载</button>
            <button id="pv-close" class="pv-x" title="关闭 (Esc)">✕</button>
          </div>
        </div>
        <div id="pv-body" class="pv-body"></div>
        <!-- 常驻横向滚动条：内容过宽时固定显示在预览底部，无需滚到最下 -->
        <div id="pv-hbar" class="pv-hbar hidden"><div id="pv-hbar-space" class="pv-hbar-space"></div></div>
      </div>
    </div>

    <!-- 设置菜单（二级菜单） -->
    <div id="settings-modal" class="modal-mask hidden">
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-head">
          <span class="modal-title">⚙️ 设置</span>
          <button id="st-close" class="pv-x" title="关闭 (Esc)">✕</button>
        </div>

        <!-- 云盘容量 -->
        <section class="st-section">
          <h3 class="st-h">💾 云盘容量</h3>
          <div class="st-quota-track"><div id="st-quota-bar" class="st-quota-bar"></div></div>
          <div id="st-quota-text" class="st-quota-text">—</div>
          <div id="st-quota-widget">
            <input id="st-quota-range" class="st-range" type="range" min="0" max="100" step="1" value="0" />
            <div class="st-scale"><span>当前</span><span id="st-quota-new" class="st-quota-new">—</span><span>上限</span></div>
            <div class="st-row">
              <div class="st-inc">
                <input id="st-quota-input" type="number" min="1" step="1" inputmode="numeric" placeholder="增加容量" />
                <span class="st-inc-unit">GB</span>
              </div>
              <button id="st-quota-btn" class="btn primary">确认扩容</button>
            </div>
          </div>
          <div id="st-quota-hint" class="st-hint">—</div>
        </section>

        <!-- 修改密码 -->
        <section class="st-section">
          <h3 class="st-h">🔑 修改登录密码</h3>
          <input id="st-oldpw" type="password" placeholder="当前密码" autocomplete="current-password" />
          <input id="st-newpw" type="password" placeholder="新密码（至少 6 位）" autocomplete="new-password" />
          <input id="st-newpw2" type="password" placeholder="确认新密码" autocomplete="new-password" />
          <button id="st-pw-btn" class="btn primary st-full">确认修改</button>
          <div id="st-msg" class="st-msg"></div>
        </section>

        <!-- 分享链接管理 -->
        <section class="st-section">
          <h3 class="st-h">🔗 分享链接管理</h3>
          <div id="sh-list" class="sh-list"><div class="st-hint">加载中…</div></div>
        </section>
      </div>
    </div>

    <!-- 分享链接弹窗 -->
    <div id="share-modal" class="modal-mask hidden">
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-head">
          <span class="modal-title">🔗 分享链接</span>
          <button id="sh-close" class="pv-x" title="关闭 (Esc)">✕</button>
        </div>
        <section class="st-section">
          <div id="sh-name" class="sh-name">—</div>
          <div class="st-row">
            <input id="sh-url" readonly spellcheck="false" placeholder="生成中…" />
            <button id="sh-copy" class="btn primary">复制</button>
          </div>
          <div class="st-row">
            <select id="sh-expire" class="sort-select sh-expire" title="链接有效期">
              <option value="24">1 天后过期</option>
              <option value="168" selected>7 天后过期</option>
              <option value="720">30 天后过期</option>
              <option value="0">永久有效</option>
            </select>
            <button id="sh-revoke" class="btn danger">停止分享</button>
          </div>
          <div id="sh-msg" class="st-msg"></div>
          <div class="st-hint">任何拿到此链接的人都可以<b>免登录直接下载</b>。更改上方有效期会自动重新生成链接；点「停止分享」可立即作废。</div>
        </section>
      </div>
    </div>

    <!-- 首次登录强制修改密码 -->
    <div id="force-modal" class="modal-mask modal-top hidden">
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-head">
          <span class="modal-title">🔐 请先修改初始密码</span>
        </div>
        <div class="force-tip">为保障安全，首次使用必须修改初始密码，修改后需重新登录。</div>
        <section class="st-section">
          <input id="fc-oldpw" type="password" placeholder="当前（初始）密码" autocomplete="current-password" />
          <input id="fc-newpw" type="password" placeholder="新密码（至少 6 位）" autocomplete="new-password" />
          <input id="fc-newpw2" type="password" placeholder="确认新密码" autocomplete="new-password" />
          <button id="fc-btn" class="btn primary st-full">修改密码并重新登录</button>
          <div id="fc-msg" class="st-msg"></div>
        </section>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
